<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>APEX DESK — Pro Trading Terminal</title>
<style>
:root{--bg:#070a0f;--panel:#0d131c;--panel2:#111a25;--line:#1b2735;--txt:#c8d6e5;--dim:#5f7288;--up:#00e08a;--dn:#ff4d5e;--amber:#ffb020;--cyan:#29b6f6;--violet:#a78bfa;--mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow:hidden}
body{background:radial-gradient(1400px 700px at 15% -15%,#0f1a28 0%,#070a0f 58%) fixed,#070a0f;color:var(--txt);font-family:var(--mono);font-size:12px;-webkit-font-smoothing:antialiased}
.app{height:100vh;display:grid;gap:8px;padding:8px;grid-template-rows:44px 28px minmax(240px,28vh) minmax(0,1fr) 22px}
.topbar{display:flex;align-items:center;gap:16px;padding:0 14px;background:linear-gradient(180deg,#101a26,#0a1119);border:1px solid var(--line);border-radius:9px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:1.6px}.logo{color:var(--up);font-size:15px;text-shadow:0 0 14px rgba(0,224,138,.8)}.brand em{color:var(--up);font-style:normal}.ver{font-size:9px;color:var(--dim);border:1px solid var(--line);padding:2px 6px;border-radius:4px;letter-spacing:.5px}.spacer{flex:1}
.status{display:flex;align-items:center;gap:7px;font-size:10px;letter-spacing:1px;color:var(--dim)}.dot{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px currentColor;animation:blink 1.2s infinite}.dot.live{background:var(--up);color:var(--up);animation:none}.dot.dead{background:var(--dn);color:var(--dn)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}.clock{font-size:15px;font-weight:600;letter-spacing:1.5px;color:#e6f1ff;text-shadow:0 0 16px rgba(41,182,246,.35)}.clock small{font-size:9px;color:var(--dim);margin-left:6px;letter-spacing:1px}
.btn{background:#152030;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:5px 11px;font-family:var(--mono);font-size:10px;letter-spacing:1px;cursor:pointer;transition:.15s}.btn:hover{background:#1c2b3f;border-color:#2c4058;color:#fff}.btn.rec.on{background:rgba(255,77,94,.16);border-color:var(--dn);color:var(--dn);animation:blink 1.2s infinite}
.ticker{overflow:hidden;border:1px solid var(--line);border-radius:8px;background:#0a1017;display:flex;align-items:center}.ticker-track{display:flex;gap:34px;white-space:nowrap;padding-left:14px;animation:scroll 55s linear infinite;will-change:transform}.ticker:hover .ticker-track{animation-play-state:paused}@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tk{display:inline-flex;gap:7px;align-items:center;font-size:11px}.tk b{color:#93a9c0;font-weight:600;letter-spacing:.6px}.tk .p{color:#dbe8f5}.tk .u{color:var(--up)}.tk .d{color:var(--dn)}
.panel{background:linear-gradient(180deg,#0e1620,#0a1017);border:1px solid var(--line);border-radius:9px;display:flex;flex-direction:column;overflow:hidden;min-width:0;min-height:0}
.ph{height:27px;flex:0 0 27px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);background:linear-gradient(180deg,#121c28,#0c141d)}.ph .tag{color:var(--cyan);font-weight:600}.ph .cnt{margin-left:auto;color:#3d5064;font-size:9px}.ph .dotc{width:6px;height:6px;border-radius:50%;background:var(--up);box-shadow:0 0 8px var(--up)}
.lists{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;min-height:0}.rows{flex:1;overflow-y:auto;overflow-x:hidden}.rows::-webkit-scrollbar,.news-list::-webkit-scrollbar{width:5px}.rows::-webkit-scrollbar-thumb,.news-list::-webkit-scrollbar-thumb{background:#22303f;border-radius:3px}.rows::-webkit-scrollbar-track,.news-list::-webkit-scrollbar-track{background:transparent}
.row{display:grid;grid-template-columns:16px 40px minmax(0,1fr) 62px 58px;align-items:center;gap:5px;padding:3.5px 9px;font-size:10.5px;border-bottom:1px solid rgba(255,255,255,.028);transition:background .1s}.row:hover{background:rgba(41,182,246,.055)}.rk{color:#3a4d61;font-size:9px;text-align:right}.sym{font-weight:700;color:#dbe9f7;letter-spacing:.4px;font-size:10.5px}.nm{color:#5d7389;font-size:9.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.px{text-align:right;color:#e6f1ff;font-variant-numeric:tabular-nums;font-size:10.5px}.ch{text-align:right;font-size:10px;font-variant-numeric:tabular-nums;padding:1px 4px;border-radius:3px}.ch.u{color:var(--up);background:rgba(0,224,138,.09)}.ch.d{color:var(--dn);background:rgba(255,77,94,.09)}
.workspace{display:grid;grid-template-columns:minmax(0,2.15fr) minmax(0,1fr) minmax(0,1.05fr);gap:8px;min-height:0}.tabs{display:flex;gap:3px;padding:5px 8px 0;border-bottom:1px solid var(--line);background:#0c141d}.tab{padding:5px 12px;font-size:9.5px;letter-spacing:1.2px;color:var(--dim);border:1px solid transparent;border-bottom:none;border-radius:6px 6px 0 0;cursor:pointer;background:transparent;font-family:var(--mono);transition:.15s}.tab:hover{color:#9fb4c8}.tab.on{color:var(--up);background:#0e1620;border-color:var(--line);box-shadow:inset 0 2px 0 var(--up)}
.chart-body{flex:1;position:relative;min-height:0}.chart-body canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.legend{flex:0 0 24px;display:flex;align-items:center;gap:14px;padding:0 12px;border-top:1px solid var(--line);font-size:9px;color:var(--dim);letter-spacing:.6px;background:#0a1017}.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.ob-head{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px;padding:3px 10px;font-size:8.5px;color:#3d5064;letter-spacing:.8px;border-bottom:1px solid var(--line)}.ob-head span:nth-child(2),.ob-head span:nth-child(3){text-align:right}.ob-side{flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;position:relative}.ob-side.asks{justify-content:flex-start}.ob-row{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px;padding:1.4px 10px;font-size:10px;position:relative;font-variant-numeric:tabular-nums}.ob-row .bg{position:absolute;top:0;bottom:0;right:0;opacity:.14}.ob-row span{position:relative;z-index:1}.ob-row span:nth-child(2),.ob-row span:nth-child(3){text-align:right}.ob-ask span:first-child{color:var(--dn)}.ob-ask .bg{background:var(--dn)}.ob-bid span:first-child{color:var(--up)}.ob-bid .bg{background:var(--up)}.ob-mid{flex:0 0 30px;display:flex;align-items:center;justify-content:center;gap:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#0c141d;font-size:14px;font-weight:700;letter-spacing:.5px}.ob-mid .spr{font-size:9px;color:var(--dim);font-weight:400}.depth-wrap{flex:0 0 96px;position:relative;border-top:1px solid var(--line)}.depth-wrap canvas{position:absolute;inset:0;width:100%;height:100%}
.news-filter{display:flex;gap:3px;margin-left:auto}.nf{font-size:8.5px;padding:2px 7px;border-radius:4px;cursor:pointer;letter-spacing:.8px;border:1px solid var(--line);background:transparent;color:var(--dim);font-family:var(--mono)}.nf.on{background:#1b2b3d;color:var(--cyan);border-color:#2b4258}.news-list{flex:1;overflow-y:auto;padding:6px 8px;display:flex;flex-direction:column;gap:6px}.ni{border-left:3px solid var(--line);background:rgba(255,255,255,.018);padding:6px 9px;border-radius:0 6px 6px 0}.ni.high{border-left-color:var(--dn);background:rgba(255,77,94,.055)}.ni.med{border-left-color:var(--amber);background:rgba(255,176,32,.045)}.ni.low{border-left-color:#2c4258}.ni-top{display:flex;align-items:center;gap:7px;margin-bottom:3px}.badge{font-size:8px;font-weight:700;letter-spacing:1px;padding:1.5px 5px;border-radius:3px}.badge.high{background:rgba(255,77,94,.2);color:var(--dn)}.badge.med{background:rgba(255,176,32,.18);color:var(--amber)}.badge.low{background:rgba(41,182,246,.14);color:var(--cyan)}.ni-src{font-size:8.5px;color:#4d6278;letter-spacing:.4px}.ni-time{margin-left:auto;font-size:8.5px;color:#3d5064}.ni-head{font-size:10.5px;line-height:1.45;color:#c2d3e4}.ni-tags{margin-top:4px;display:flex;gap:5px;flex-wrap:wrap}.ni-tags span{font-size:8.5px;color:var(--cyan);background:rgba(41,182,246,.08);padding:1px 5px;border-radius:3px}
.footer{display:flex;align-items:center;gap:18px;padding:0 12px;font-size:9px;color:#3d5064;letter-spacing:.9px;border:1px solid var(--line);border-radius:7px;background:#0a1017}.footer b{color:#6d8399;font-weight:500}.footer .ok{color:var(--up)}
@media(max-width:1000px){html,body{overflow:auto;height:auto}.app{height:auto;grid-template-rows:none}.topbar{flex-wrap:wrap;height:auto;padding:8px 12px;gap:10px}.ticker{height:28px}.lists{grid-template-columns:1fr 1fr}.lists .panel{height:280px}.workspace{grid-template-columns:1fr}.workspace>.panel{min-height:440px}.footer{flex-wrap:wrap;height:auto;padding:6px 12px;gap:10px}}
@media(max-width:600px){.lists{grid-template-columns:1fr}.lists .panel{height:250px}.topbar .ver{display:none}.clock{font-size:12px}.btn{padding:5px 7px}.workspace>.panel{min-height:390px}.tab{padding:5px 7px;font-size:8px}}
</style>
</head>
<body>
<div id="errbar" style="display:none;position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#7a1020;color:#fff;font:12px monospace;padding:7px 10px"></div>
<div class="app">
<header class="topbar">
<div class="brand"><span class="logo">◆</span>APEX<em>DESK</em></div><span class="ver">v1.1 PRO</span><div class="spacer"></div>

<div class="clock" id="clock">--:--:--<small>LOCAL</small></div>
<button class="btn rec" id="recBtn">● REC</button><button class="btn" id="fsBtn">⛶ FULLSCREEN</button>
</header>

<div class="panel"><div class="ph"><span class="dotc"></span>TOP 10 <span class="tag">RARE EARTH METALS</span><span class="cnt">$/kg · REF</span></div><div class="rows" id="list-metals"></div></div>
<div class="panel"><div class="ph"><span class="dotc"></span>TOP 10 <span class="tag">RARE EARTH MINERALS</span><span class="cnt">$/t · REF</span></div><div class="rows" id="list-minerals"></div></div>
</section>
<section class="workspace">
<div class="panel">

</div>

<div class="ob-head"><span>PRICE</span><span>SIZE</span><span>TOTAL</span></div>
<div class="ob-side asks" id="obAsks"></div><div class="ob-mid"><span id="obMid">—</span><span class="spr" id="obSpr"></span></div><div class="ob-side bids" id="obBids"></div><div class="depth-wrap"><canvas id="depthCanvas"></canvas></div>
</div>
<div class="panel">
<div class="ph">LIVE NEWS<div class="news-filter"><button class="nf on" data-f="all">ALL</button><button class="nf" data-f="high">HIGH</button><button class="nf" data-f="med">MED</button></div></div>
<div class="news-list" id="newsList"></div>
</div>
</section>
<footer class="footer"><span>FEED <b class="ok" id="fFeed">—</b></span><span>LATENCY <b id="fLat">—</b></span><span>SYMBOLS <b id="fSym">0</b></span><span>NEWS EVENTS <b id="fNews">0</b></span><span>SESSION <b id="fUp">00:00:00</b></span><span style="margin-left:auto">KEYS <b>1 2 3 4</b> · REC <b>R</b> · FULLSCREEN <b>F</b></span></footer>
</div>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const fmt=(n,d=2)=>Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtP=n=>n>=1000?fmt(n,2):n>=1?fmt(n,3):n>=.01?fmt(n,4):fmt(n,6);

const CRYPTO=[
{bs:'BTCUSDT',sym:'BTC',name:'Bitcoin',price:104250,chg:0},{bs:'ETHUSDT',sym:'ETH',name:'Ethereum',price:3480.5,chg:0},
{bs:'SOLUSDT',sym:'SOL',name:'Solana',price:196.42,chg:0},{bs:'BNBUSDT',sym:'BNB',name:'BNB',price:684.2,chg:0},
{bs:'XRPUSDT',sym:'XRP',name:'XRP',price:2.421,chg:0},{bs:'ADAUSDT',sym:'ADA',name:'Cardano',price:.892,chg:0},
{bs:'DOGEUSDT',sym:'DOGE',name:'Dogecoin',price:.318,chg:0},{bs:'AVAXUSDT',sym:'AVAX',name:'Avalanche',price:38.62,chg:0},
{bs:'LINKUSDT',sym:'LINK',name:'Chainlink',price:22.84,chg:0},{bs:'DOTUSDT',sym:'DOT',name:'Polkadot',price:7.42,chg:0}];
const STOCKS=[
{sym:'NVDA',name:'NVIDIA Corp',price:182.44,chg:0},{sym:'AAPL',name:'Apple Inc',price:241.82,chg:0},{sym:'MSFT',name:'Microsoft Corp',price:512.31,chg:0},
{sym:'TSLA',name:'Tesla Inc',price:428.65,chg:0},{sym:'AMZN',name:'Amazon.com',price:231.54,chg:0},{sym:'GOOGL',name:'Alphabet Inc A',price:198.27,chg:0},
{sym:'META',name:'Meta Platforms',price:742.10,chg:0},{sym:'AVGO',name:'Broadcom Inc',price:368.92,chg:0},{sym:'TSM',name:'Taiwan Semi',price:294.73,chg:0},{sym:'AMD',name:'Adv. Micro Dev',price:176.38,chg:0}];
const METALS=[
{sym:'Nd',name:'Neodymium',price:92.4,chg:null},{sym:'Pr',name:'Praseodymium',price:104.2,chg:null},{sym:'Dy',name:'Dysprosium',price:298.5,chg:null},
{sym:'Tb',name:'Terbium',price:842,chg:null},{sym:'La',name:'Lanthanum',price:2.15,chg:null},{sym:'Ce',name:'Cerium',price:2.05,chg:null},
{sym:'Sm',name:'Samarium',price:4.8,chg:null},{sym:'Eu',name:'Europium',price:31.6,chg:null},{sym:'Gd',name:'Gadolinium',price:29.4,chg:null},{sym:'Y',name:'Yttrium',price:26.8,chg:null}];
const MINERALS=[
{sym:'BST',name:'Bastnäsite',price:14200,chg:null},{sym:'MNZ',name:'Monazite',price:9800,chg:null},{sym:'XNT',name:'Xenotime',price:26400,chg:null},
{sym:'ALN',name:'Allanite',price:5200,chg:null},{sym:'EUX',name:'Euxenite',price:7400,chg:null},{sym:'FRG',name:'Fergusonite',price:11300,chg:null},
{sym:'GDL',name:'Gadolinite',price:8900,chg:null},{sym:'SMR',name:'Samarskite',price:10600,chg:null},{sym:'PRS',name:'Parisite',price:6700,chg:null},{sym:'APT',name:'Apatite (REE)',price:3100,chg:null}];

let LIVE=false, LATENCY=0, lastMsg=0, newsFilter='all', currentTab='footprint';
const T0=Date.now(), depth={bids:[],asks:[],mid:0}, trades=[];
let ws=null, wsRetry=0, restTimer=null, lastTradeId=0, rec=false;

function err(e){const d=$('#errbar');d.style.display='block';d.textContent='JS error: '+(e&&e.message?e.message:e);setTimeout(()=>d.style.display='none',7000)}
addEventListener('error',e=>err(e.error||e.message));
function setFeed(state,txt){$('#feedDot').className='dot '+(state==='live'?'live':state==='dead'?'dead':'');$('#feedTxt').textContent=txt;$('#fFeed').textContent=txt;$('#fFeed').className=state==='live'?'ok':''}
function rowHTML(o,i){const has=o.price!=null,up=(o.chg||0)>=0;const right=o.chg==null?'<span class="ch" style="color:#5f7288">REF</span>':`<span class="ch ${up?'u':'d'}">${up?'+':''}${Number(o.chg).toFixed(2)}%</span>`;return `<div class="row"><span class="rk">${i+1}</span><span class="sym">${o.sym}</span><span class="nm">${o.name}</span><span class="px">${has?fmtP(o.price):'—'}</span>${right}</div>`}
function renderList(id,arr){$(id).innerHTML=arr.map(rowHTML).join('')}
function renderAll(){renderList('#list-crypto',CRYPTO);renderList('#list-stocks',STOCKS);renderList('#list-metals',METALS);renderList('#list-minerals',MINERALS);$('#fSym').textContent=CRYPTO.length+STOCKS.length+METALS.length+MINERALS.length}
renderAll();

function tickerHTML(){let a=CRYPTO.map(c=>`<span class="tk"><b>${c.sym}</b><span class="p">${c.price!=null?fmtP(c.price):'—'}</span><span class="${(c.chg||0)>=0?'u':'d'}">${c.chg==null?'—':((c.chg>=0?'+':'')+c.chg.toFixed(2)+'%')}</span></span>`);$('#tickerTrack').innerHTML=a.concat(a).join('')}
tickerHTML();

const REST=['https://api.binance.com','https://data-api.binance.vision','https://api1.binance.com'];
async function restGet(path){for(const h of REST){try{const r=await fetch(h+path,{cache:'no-store'});if(r.ok)return await r.json()}catch(e){}}throw Error('REST unavailable')}
function applyTicker(arr){arr.forEach(t=>{const c=CRYPTO.find(x=>x.bs===t.symbol);if(c){c.price=+t.lastPrice;c.chg=+t.priceChangePercent}})}
function onDepth(d){if(!d.bids||!d.asks)return;depth.bids=d.bids.map(x=>[+x[0],+x[1]]);depth.asks=d.asks.map(x=>[+x[0],+x[1]]);if(depth.bids[0]&&depth.asks[0])depth.mid=(depth.bids[0][0]+depth.asks[0][0])/2}
function onTicker(d){const c=CRYPTO.find(x=>x.bs===d.s);if(c){c.price=+d.c;c.chg=+d.P}}
function addTrade(p,q,bm){trades.push({p,q,buy:!bm,t:Date.now()});if(trades.length>180)trades.shift()}
function onTrade(d){addTrade(+d.p,+d.q,d.m);lastMsg=Date.now()}
async function restPoll(){try{const a=await restGet('/api/v3/ticker/24hr?symbols='+encodeURIComponent(JSON.stringify(CRYPTO.map(x=>x.bs))));applyTicker(a);const d=await restGet('/api/v3/depth?symbol=BTCUSDT&limit=20');onDepth(d);const tr=await restGet('/api/v3/trades?symbol=BTCUSDT&limit=50');tr.forEach(t=>addTrade(+t.price,+t.qty,t.isBuyerMaker));LIVE=true;setFeed('live','LIVE · BINANCE REST');lastMsg=Date.now()}catch(e){LIVE=false;setFeed('dead','NO MARKET DATA — RETRYING')}}
function startRest(){if(restTimer)return;restPoll();restTimer=setInterval(restPoll,2500)}
function connectWS(){
 setFeed('wait','CONNECTING…');
 const streams=CRYPTO.map(c=>c.bs.toLowerCase()+'@ticker').concat(['btcusdt@depth20@100ms','btcusdt@aggTrade']).join('/');
 try{ws=new WebSocket('wss://stream.binance.com:9443/stream?streams='+streams)}catch(e){startRest();return}
 let opened=false;
 const timer=setTimeout(()=>{if(!opened){try{ws.close()}catch(e){}startRest()}},5000);
 ws.onopen=()=>{opened=true;clearTimeout(timer);if(restTimer){clearInterval(restTimer);restTimer=null}LIVE=true;setFeed('live','LIVE · BINANCE WS')};
 ws.onmessage=e=>{try{const m=JSON.parse(e.data),s=m.stream,d=m.data;if(!d)return;lastMsg=Date.now();if(s.endsWith('@ticker'))onTicker(d);else if(s.includes('@depth'))onDepth(d);else if(s.includes('@aggTrade'))onTrade(d)}catch(_){}};
 ws.onerror=()=>{};
 ws.onclose=()=>{clearTimeout(timer);LIVE=false;setFeed('wait','RECONNECTING…');startRest();setTimeout(connectWS,Math.min(10000,1500+wsRetry++*700))};
}
connectWS();

function drawCanvas(c,fn){const r=c.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2),w=Math.max(1,Math.floor(r.width*dpr)),h=Math.max(1,Math.floor(r.height*dpr));if(c.width!==w||c.height!==h){c.width=w;c.height=h}const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);fn(x,r.width,r.height)}
function mainChart(ctx,w,h){
 ctx.clearRect(0,0,w,h);ctx.fillStyle='#091018';ctx.fillRect(0,0,w,h);
 const p=CRYPTO[0].price||104000, n=90, pts=[];let v=p*.997;for(let i=0;i<n;i++){v*=1+(Math.sin(i*.41)*.00065+(Math.random()-.49)*.0017);pts.push(v)}pts[n-1]=p;
 const min=Math.min(...pts)*.998,max=Math.max(...pts)*1.002, sx=w/(n-1), sy=h/(max-min);
 ctx.strokeStyle='rgba(255,255,255,.045)';ctx.lineWidth=1;for(let i=1;i<7;i++){let y=i*h/7;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}for(let i=1;i<9;i++){let xx=i*w/9;ctx.beginPath();ctx.moveTo(xx,0);ctx.lineTo(xx,h);ctx.stroke()}
 if(currentTab==='liquidity'){for(let i=0;i<28;i++){ctx.fillStyle=i%3===0?'rgba(41,182,246,.09)':'rgba(167,139,250,.055)';ctx.fillRect(Math.random()*w,Math.random()*h,20+Math.random()*90,5+Math.random()*18)}}
 ctx.beginPath();pts.forEach((v,i)=>{const x=i*sx,y=h-(v-min)*sy;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.strokeStyle=currentTab==='flow'?'#ffb020':'#00e08a';ctx.lineWidth=1.5;ctx.stroke();
 const last=pts.at(-1),ly=h-(last-min)*sy;ctx.setLineDash([4,4]);ctx.strokeStyle='rgba(41,182,246,.5)';ctx.beginPath();ctx.moveTo(0,ly);ctx.lineTo(w,ly);ctx.stroke();ctx.setLineDash([]);
 ctx.fillStyle='#c8d6e5';ctx.font='10px monospace';ctx.fillText('BTCUSDT  '+fmtP(p),10,16);
 if(currentTab==='flow'){let base=h*.82;for(let i=0;i<trades.length;i+=3){let t=trades[i],bar=Math.min(60,t.q*8);ctx.fillStyle=t.buy?'rgba(0,224,138,.55)':'rgba(255,77,94,.55)';ctx.fillRect(i/trades.length*w,base-bar,Math.max(2,w/trades.length*2),bar)}}
}
function drawDepth(ctx,w,h){ctx.clearRect(0,0,w,h);ctx.fillStyle='#091018';ctx.fillRect(0,0,w,h);if(!depth.bids.length||!depth.asks.length)return;const all=[...depth.asks.slice(0,15).reverse(),...depth.bids.slice(0,15)],max=Math.max(...all.map(x=>x[1]));let x=w*.5;ctx.strokeStyle='#334252';ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();let step=(w*.47)/15;depth.bids.slice(0,15).forEach((a,i)=>{ctx.fillStyle='rgba(0,224,138,.22)';ctx.fillRect(x-(i+1)*step,h-a[1]/max*h,x-step*.1,a[1]/max*h)});depth.asks.slice(0,15).forEach((a,i)=>{ctx.fillStyle='rgba(255,77,94,.22)';ctx.fillRect(x+i*step,h-a[1]/max*h,step*.9,a[1]/max*h)})}
function renderBook(){
 const asks=depth.asks.slice(0,12).sort((a,b)=>b[0]-a[0]),bids=depth.bids.slice(0,12);let cum=0;
 $('#obAsks').innerHTML=asks.map(a=>{cum+=a[1];return `<div class="ob-row ob-ask"><i class="bg" style="width:${Math.min(100,a[1]/Math.max(...asks.map(x=>x[1]),1)*100)}%"></i><span>${fmtP(a[0])}</span><span>${fmt(a[1],4)}</span><span>${fmt(cum,3)}</span></div>`}).join('');
 cum=0;$('#obBids').innerHTML=bids.map(a=>{cum+=a[1];return `<div class="ob-row ob-bid"><i class="bg" style="width:${Math.min(100,a[1]/Math.max(...bids.map(x=>x[1]),1)*100)}%"></i><span>${fmtP(a[0])}</span><span>${fmt(a[1],4)}</span><span>${fmt(cum,3)}</span></div>`}).join('');
 const bid=depth.bids[0]?.[0],ask=depth.asks[0]?.[0];if(bid&&ask){const spr=ask-bid;$('#obMid').textContent=fmtP((bid+ask)/2);$('#obSpr').textContent='SPREAD '+fmt(spr,2);$('#obSpread').textContent=fmt(spr,2)}
}
function legend(){const map={footprint:'<i style="background:#00e08a"></i> PRICE FOOTPRINT · BTC/USDT',liquidity:'<i style="background:#29b6f6"></i> LIQUIDITY HEATMAP · LIVE ORDER BOOK',flow:'<i style="background:#ffb020"></i> AGGRESSIVE BUY/SELL FLOW · DELTA',depth:'<i style="background:#a78bfa"></i> MARKET DEPTH · BID / ASK'};$('#legend').innerHTML=map[currentTab]}
function redraw(){drawCanvas($('#mainCanvas'),mainChart);drawCanvas($('#depthCanvas'),drawDepth);renderBook();legend()}
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');currentTab=b.dataset.tab;redraw()});
addEventListener('resize',redraw);legend();

const NEWS=[
['high','MARKET','BTC liquidity is updating in real time','BTC','ORDERBOOK'],['med','MACRO','Crypto markets remain sensitive to global risk flows','MACRO','RISK'],['med','FLOW','Watch aggressive bid/ask imbalance around BTC','BTC','FLOW'],['low','SYSTEM','Binance market-data feed connected','FEED','LIVE'],['low','MARKET','Altcoin volatility remains active across majors','ALTS','VOLATILITY']
];
function renderNews(){const a=NEWS.filter(n=>newsFilter==='all'||n[0]===newsFilter);$('#newsList').innerHTML=a.map(n=>`<div class="ni ${n[0]}"><div class="ni-top"><span class="badge ${n[0]}">${n[0].toUpperCase()}</span><span class="ni-src">${n[1]}</span><span class="ni-time">LIVE</span></div><div class="ni-head">${n[2]}</div><div class="ni-tags"><span>${n[3]}</span><span>${n[4]}</span></div></div>`).join('');$('#fNews').textContent=NEWS.length}
renderNews();$$('.nf').forEach(b=>b.onclick=()=>{$$('.nf').forEach(x=>x.classList.remove('on'));b.classList.add('on');newsFilter=b.dataset.f;renderNews()});

function tickUI(){const now=new Date();$('#clock').innerHTML=now.toLocaleTimeString('en-GB')+'<small>LOCAL</small>';const s=Math.floor((Date.now()-T0)/1000),h=String(Math.floor(s/3600)).padStart(2,'0'),m=String(Math.floor(s%3600/60)).padStart(2,'0'),q=String(s%60).padStart(2,'0');$('#fUp').textContent=`${h}:${m}:${q}`;$('#fLat').textContent=lastMsg?Math.max(0,Date.now()-lastMsg)+' ms':'—';tickerHTML();renderList('#list-crypto',CRYPTO);if(Date.now()%7000<1000)redraw()}
setInterval(tickUI,1000);tickUI();

$('#fsBtn').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
$('#recBtn').onclick=()=>{rec=!rec;$('#recBtn').classList.toggle('on',rec);$('#recBtn').textContent=rec?'■ REC ON':'● REC'};
addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(e.key.toLowerCase()==='f')$('#fsBtn').click();if(e.key.toLowerCase()==='r')$('#recBtn').click();const n=+e.key;if(n>=1&&n<=4){const b=$$('.tab')[n-1];if(b)b.click()}});
$('#c-stocks').onclick=async()=>{let k=prompt('Optional: paste your Finnhub API key. Leave blank for demo stock prices.',localStorage.getItem('finnhub_key')||'');if(k===null)return;k=k.trim();localStorage.setItem('finnhub_key',k);if(!k){$('#c-stocks').textContent='DEMO · KEY';return}let ok=0;for(const o of STOCKS){try{const j=await (await fetch('https://finnhub.io/api/v1/quote?symbol='+o.sym+'&token='+encodeURIComponent(k))).json();if(j.c){o.price=j.c;o.chg=j.dp;ok++}}catch(e){}}$('#c-stocks').textContent=ok?'FINNHUB · LIVE':'DEMO · KEY';renderList('#list-stocks',STOCKS)};
redraw();
})();
