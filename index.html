<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APEX DESK • VIP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --bg: #070b14;
    --bg-card: rgba(15, 23, 42, 0.78);
    --bg-card-hover: rgba(20, 30, 55, 0.88);
    --border: rgba(148, 163, 184, 0.12);
    --border-gold: rgba(234, 179, 8, 0.4);
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --text-muted: #64748b;
    --accent: #f59e0b;
    --accent-soft: rgba(245, 158, 11, 0.15);
    --green: #10b981;
    --green-soft: rgba(16, 185, 129, 0.15);
    --red: #ef4444;
    --red-soft: rgba(239, 68, 68, 0.15);
    --blue: #3b82f6;
    --purple: #8b5cf6;
    --radius: 12px;
    --glow: 0 0 24px rgba(245, 158, 11, 0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    background-image: 
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(245, 158, 11, 0.07), transparent),
      radial-gradient(ellipse 60% 40% at 100% 100%, rgba(59, 130, 246, 0.05), transparent);
  }

  /* ========== HEADER ========== */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background: rgba(7, 11, 20, 0.92);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(14px);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon {
    width: 30px; height: 30px;
    background: linear-gradient(135deg, #f59e0b, #d97706);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px; color: #000;
    box-shadow: var(--glow);
  }
  .logo-text { font-weight: 700; font-size: 16px; letter-spacing: 0.4px; }
  .logo-text span { color: var(--accent); }
  .version {
    font-size: 11px; color: var(--text-muted);
    background: rgba(255,255,255,0.05);
    padding: 2px 8px; border-radius: 20px; margin-left: 4px;
  }
  .vip-badge {
    background: linear-gradient(135deg, #f59e0b, #d97706);
    color: #000; font-size: 10px; font-weight: 800;
    padding: 2px 8px; border-radius: 4px; letter-spacing: 0.5px;
  }

  .header-center { display: flex; align-items: center; gap: 14px; font-size: 12px; }
  .status-pill {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 20px;
    background: var(--green-soft); color: var(--green); font-weight: 500;
  }
  .status-dot {
    width: 7px; height: 7px; background: var(--green); border-radius: 50%;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.8); }
  }

  .header-right { display: flex; align-items: center; gap: 10px; }
  .time-display {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px; color: var(--text-dim); letter-spacing: 0.4px;
  }

  .btn {
    padding: 6px 13px; border-radius: 8px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.04);
    color: var(--text); font-size: 12px; font-weight: 500;
    cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; gap: 6px;
  }
  .btn:hover { background: rgba(255,255,255,0.09); border-color: var(--border-gold); }
  .btn-rec {
    background: var(--red-soft); border-color: rgba(239,68,68,0.35); color: var(--red);
  }
  .btn-rec.active { animation: rec-pulse 1.2s infinite; }
  @keyframes rec-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); }
    50% { box-shadow: 0 0 0 7px rgba(239,68,68,0); }
  }
  .btn-snap {
    background: var(--accent-soft); border-color: var(--border-gold); color: var(--accent);
  }
  .btn-snap:hover { background: rgba(245,158,11,0.25); }

  /* ========== TICKER ========== */
  .ticker-wrap {
    background: rgba(10, 15, 28, 0.96);
    border-bottom: 1px solid var(--border);
    overflow: hidden;
  }
  .ticker {
    display: flex; white-space: nowrap;
    animation: ticker-scroll 45s linear infinite;
    padding: 8px 0;
  }
  .ticker:hover { animation-play-state: paused; }
  @keyframes ticker-scroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  .ticker-item {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 0 18px; font-size: 12px;
    border-right: 1px solid var(--border);
  }
  .ticker-item .symbol { font-weight: 600; }
  .ticker-item .price { font-family: 'JetBrains Mono', monospace; color: var(--text-dim); }
  .ticker-item .change {
    font-weight: 600; font-size: 11px; padding: 2px 6px; border-radius: 4px;
  }
  .change.up { color: var(--green); background: var(--green-soft); }
  .change.down { color: var(--red); background: var(--red-soft); }
  .change.flat { color: var(--text-muted); background: rgba(255,255,255,0.05); }

  /* ========== MAIN ========== */
  .main {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px; padding: 12px;
  }
  @media (max-width: 1400px) { .main { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 800px) { .main { grid-template-columns: 1fr; } }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    backdrop-filter: blur(16px);
    overflow: hidden;
    transition: all 0.25s;
  }
  .card:hover { border-color: rgba(148,163,184,0.22); background: var(--bg-card-hover); }

  .card-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 15px; border-bottom: 1px solid var(--border);
  }
  .card-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.4px;
    text-transform: uppercase; color: var(--text-dim);
  }
  .card-title .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
  .card-badge {
    font-size: 10px; padding: 2px 8px; border-radius: 20px;
    background: rgba(255,255,255,0.05); color: var(--text-muted); font-weight: 500;
  }
  .card-badge.live { background: var(--green-soft); color: var(--green); }
  .card-badge.ref { background: rgba(139,92,246,0.15); color: var(--purple); }

  .list { max-height: 310px; overflow-y: auto; }
  .list::-webkit-scrollbar { width: 4px; }
  .list::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.2); border-radius: 4px; }

  .list-item {
    display: grid;
    grid-template-columns: 22px 1fr auto auto;
    gap: 10px; align-items: center;
    padding: 9px 15px; font-size: 13px;
    border-bottom: 1px solid rgba(148,163,184,0.05);
    transition: background 0.15s; cursor: pointer;
  }
  .list-item:hover { background: rgba(255,255,255,0.04); }
  .list-item:active { background: rgba(245,158,11,0.08); }
  .list-item:last-child { border-bottom: none; }

  .rank { font-size: 11px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
  .name-wrap { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .symbol-name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .full-name { font-size: 10px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .price { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; text-align: right; }
  .chg {
    font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 5px;
    min-width: 58px; text-align: center;
  }
  .chg.up { color: var(--green); background: var(--green-soft); }
  .chg.down { color: var(--red); background: var(--red-soft); }
  .chg.flat { color: var(--text-muted); background: rgba(255,255,255,0.05); }

  /* ========== BOTTOM ========== */
  .bottom {
    display: grid;
    grid-template-columns: 1.55fr 1fr 0.9fr;
    gap: 12px; padding: 0 12px 12px;
  }
  @media (max-width: 1200px) { .bottom { grid-template-columns: 1fr; } }

  .chart-card { min-height: 340px; }
  .chart-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
  }
  .chart-tabs { display: flex; gap: 4px; }
  .chart-tab {
    padding: 4px 12px; font-size: 11px; border-radius: 6px;
    cursor: pointer; color: var(--text-muted); border: none; background: transparent;
    transition: all 0.2s;
  }
  .chart-tab.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .chart-tab:hover:not(.active) { background: rgba(255,255,255,0.05); color: var(--text); }

  .price-big {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px; font-weight: 600; letter-spacing: -0.5px;
  }
  .price-big .chg-inline { font-size: 13px; margin-left: 10px; }
  #chartCanvas { width: 100%; height: 260px; display: block; }

  /* Order Book */
  .orderbook { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
  .ob-header {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    padding: 8px 16px; color: var(--text-muted); font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.4px;
    border-bottom: 1px solid var(--border);
  }
  .ob-row {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    padding: 5px 16px; position: relative; transition: background 0.15s;
  }
  .ob-row:hover { background: rgba(255,255,255,0.03); }
  .ob-row .bar { position: absolute; top: 0; bottom: 0; opacity: 0.13; z-index: 0; }
  .ob-row.ask .bar { right: 0; background: var(--red); }
  .ob-row.bid .bar { left: 0; background: var(--green); }
  .ob-row span { position: relative; z-index: 1; }
  .ob-row.ask .price { color: var(--red); }
  .ob-row.bid .price { color: var(--green); }

  .ob-spread {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 10px; background: rgba(245,158,11,0.06);
    border-top: 1px solid var(--border-gold); border-bottom: 1px solid var(--border-gold);
    font-size: 13px; font-weight: 600;
  }
  .ob-spread .mid { color: var(--accent); font-size: 15px; }
  .ob-spread .spread-val { font-size: 11px; color: var(--text-muted); }

  /* News */
  .news-list { max-height: 340px; overflow-y: auto; }
  .news-item {
    padding: 12px 16px; border-bottom: 1px solid rgba(148,163,184,0.06);
    cursor: pointer; transition: background 0.15s;
  }
  .news-item:hover { background: rgba(255,255,255,0.03); }
  .news-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .news-tag {
    font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 4px;
    text-transform: uppercase; letter-spacing: 0.3px;
  }
  .news-tag.high { background: var(--red-soft); color: var(--red); }
  .news-tag.med { background: rgba(245,158,11,0.15); color: var(--accent); }
  .news-tag.low { background: rgba(59,130,246,0.15); color: var(--blue); }
  .news-source { font-size: 10px; color: var(--text-muted); }
  .news-live { font-size: 9px; color: var(--green); margin-left: auto; }
  .news-title { font-size: 12px; line-height: 1.45; font-weight: 500; }

  /* Footer */
  .footer {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 20px; font-size: 11px; color: var(--text-muted);
    border-top: 1px solid var(--border); background: rgba(7,11,20,0.85);
  }
  .footer-left { display: flex; gap: 16px; flex-wrap: wrap; }
  .footer-item { display: flex; align-items: center; gap: 5px; }
  .footer-item .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); }

  /* ========== POWER PAGE MODAL ========== */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,0.75); backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center;
    padding: 20px; opacity: 0; transition: opacity 0.25s;
  }
  .modal-overlay.open { display: flex; opacity: 1; }

  .power-page {
    background: #0c1220;
    border: 1px solid var(--border-gold);
    border-radius: 16px;
    width: 100%; max-width: 920px; max-height: 90vh;
    overflow-y: auto; box-shadow: 0 25px 80px rgba(0,0,0,0.6), var(--glow);
    transform: scale(0.95); transition: transform 0.25s;
  }
  .modal-overlay.open .power-page { transform: scale(1); }

  .pp-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 24px; border-bottom: 1px solid var(--border);
    background: rgba(245,158,11,0.04);
  }
  .pp-title { display: flex; align-items: center; gap: 14px; }
  .pp-icon {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, #f59e0b, #d97706);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 16px; color: #000;
  }
  .pp-name { font-size: 20px; font-weight: 700; }
  .pp-fullname { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .pp-close {
    width: 36px; height: 36px; border-radius: 10px;
    border: 1px solid var(--border); background: rgba(255,255,255,0.04);
    color: var(--text); font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .pp-close:hover { background: var(--red-soft); border-color: rgba(239,68,68,0.4); color: var(--red); }

  .pp-body { padding: 20px 24px; }
  .pp-price-row {
    display: flex; align-items: baseline; gap: 16px; margin-bottom: 20px;
  }
  .pp-price {
    font-family: 'JetBrains Mono', monospace;
    font-size: 32px; font-weight: 700;
  }
  .pp-chg {
    font-size: 16px; font-weight: 600; padding: 4px 12px; border-radius: 8px;
  }

  .pp-stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
    margin-bottom: 20px;
  }
  @media (max-width: 600px) { .pp-stats { grid-template-columns: 1fr 1fr; } }
  .pp-stat {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px;
  }
  .pp-stat-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.3px; }
  .pp-stat-val { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 600; }

  .pp-chart-wrap {
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--border);
    border-radius: 12px; padding: 12px; margin-bottom: 20px;
  }
  #ppChart { width: 100%; height: 200px; display: block; }

  .pp-actions {
    display: flex; gap: 12px; margin-bottom: 16px;
  }
  .pp-btn {
    flex: 1; padding: 14px; border-radius: 10px; border: none;
    font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .pp-btn.buy { background: var(--green); color: #000; }
  .pp-btn.buy:hover { background: #059669; }
  .pp-btn.sell { background: var(--red); color: #fff; }
  .pp-btn.sell:hover { background: #dc2626; }
  .pp-btn.snap {
    background: var(--accent-soft); color: var(--accent);
    border: 1px solid var(--border-gold); flex: 0.6;
  }
  .pp-btn.snap:hover { background: rgba(245,158,11,0.25); }

  .pp-info {
    font-size: 12px; color: var(--text-muted); line-height: 1.5;
    padding: 12px; background: rgba(255,255,255,0.02);
    border-radius: 8px; border: 1px solid var(--border);
  }

  /* Snapshot toast */
  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: #0f172a; border: 1px solid var(--border-gold);
    color: var(--text); padding: 14px 24px; border-radius: 12px;
    font-size: 13px; font-weight: 500; z-index: 2000;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5); transition: transform 0.3s;
    display: flex; align-items: center; gap: 10px;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="logo">
    <div class="logo-icon">A</div>
    <div class="logo-text">APEX <span>DESK</span></div>
    <span class="version">v2.1 VIP</span>
    <span class="vip-badge">VIP</span>
  </div>
  <div class="header-center">
    <div class="status-pill"><span class="status-dot"></span> LIVE • BINANCE WS</div>
    <span style="color:var(--text-muted)">|</span>
    <span style="color:var(--text-dim)">Latency: <strong id="latency">42 ms</strong></span>
  </div>
  <div class="header-right">
    <div class="time-display" id="clock">--:--:-- LOCAL</div>
    <button class="btn btn-rec active" id="recBtn" onclick="toggleRec()">
      <span style="width:8px;height:8px;background:currentColor;border-radius:50%;display:inline-block;"></span>
      <span id="recLabel">REC ON</span>
    </button>
    <button class="btn btn-snap" onclick="takeSnapshot()" title="Capture snapshot for sharing">
      📷 SNAPSHOT
    </button>
    <button class="btn" onclick="toggleFullscreen()">⛶ FULLSCREEN</button>
  </div>
</header>

<!-- TICKER -->
<div class="ticker-wrap">
  <div class="ticker" id="ticker"></div>
</div>

<!-- TOP LISTS -->
<div class="main">
  <div class="card">
    <div class="card-header">
      <div class="card-title"><span class="dot"></span> TOP 10 CRYPTO</div>
      <span class="card-badge live">LIVE</span>
    </div>
    <div class="list" id="cryptoList"></div>
  </div>
  <div class="card">
    <div class="card-header">
      <div class="card-title"><span class="dot" style="background:var(--blue)"></span> TOP 10 STOCKS</div>
      <span class="card-badge live">LIVE</span>
    </div>
    <div class="list" id="stocksList"></div>
  </div>
  <div class="card">
    <div class="card-header">
      <div class="card-title"><span class="dot" style="background:var(--purple)"></span> TOP 10 RARE EARTH METALS</div>
      <span class="card-badge live">$/KG • LIVE</span>
    </div>
    <div class="list" id="metalsList"></div>
  </div>
  <div class="card">
    <div class="card-header">
      <div class="card-title"><span class="dot" style="background:var(--accent)"></span> TOP 10 RARE EARTH MINERALS</div>
      <span class="card-badge live">$/T • LIVE</span>
    </div>
    <div class="list" id="mineralsList"></div>
  </div>
</div>

<!-- BOTTOM -->
<div class="bottom">
  <div class="card chart-card">
    <div class="chart-header">
      <div>
        <div class="card-title" style="margin-bottom:6px"><span class="dot"></span> PRICE FOOTPRINT • <span id="mainSymbol">BTC/USDT</span></div>
        <div class="price-big">
          <span id="btcPrice">85,753.33</span>
          <span class="chg-inline change up" id="btcChg">+1.00%</span>
        </div>
      </div>
      <div class="chart-tabs">
        <button class="chart-tab active" data-tf="1H">1H</button>
        <button class="chart-tab" data-tf="4H">4H</button>
        <button class="chart-tab" data-tf="1D">1D</button>
        <button class="chart-tab" data-tf="1W">1W</button>
      </div>
    </div>
    <canvas id="chartCanvas"></canvas>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="card-title"><span class="dot"></span> ORDER BOOK <span id="obSymbol">BTC/USDT</span></div>
      <span class="card-badge">0.01</span>
    </div>
    <div class="orderbook">
      <div class="ob-header">
        <span>PRICE</span>
        <span style="text-align:center">SIZE</span>
        <span style="text-align:right">TOTAL</span>
      </div>
      <div id="asks"></div>
      <div class="ob-spread">
        <span class="mid" id="midPrice">85,753.33</span>
        <span class="spread-val">SPREAD <span id="spread">0.01</span></span>
      </div>
      <div id="bids"></div>
    </div>
  </div>

  <div class="card
