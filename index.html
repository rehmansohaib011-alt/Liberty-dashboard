<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>APEX DESK — Pro Trading Terminal</title>
<style>
:root{
  --bg:#070a0f; --panel:#0d131c; --panel2:#111a25; --line:#1b2735;
  --txt:#c8d6e5; --dim:#5f7288; --up:#00e08a; --dn:#ff4d5e;
  --amber:#ffb020; --cyan:#29b6f6; --violet:#a78bfa;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:radial-gradient(1400px 700px at 15% -15%,#0f1a28 0%,#070a0f 58%) fixed,#070a0f;
  color:var(--txt); font-family:var(--mono); font-size:12px;
  -webkit-font-smoothing:antialiased;
}
.app{
  height:100vh; display:grid; gap:8px; padding:8px;
  grid-template-rows:44px 28px minmax(170px,25vh) minmax(0,1fr) 22px;
}
.topbar{
  display:flex; align-items:center; gap:16px; padding:0 14px;
  background:linear-gradient(180deg,#101a26,#0a1119);
  border:1px solid var(--line); border-radius:9px;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:1.6px}
.logo{color:var(--up);font-size:15px;text-shadow:0 0 14px rgba(0,224,138,.8)}
.brand em{color:var(--up);font-style:normal}
.ver{font-size:9px;color:var(--dim);border:1px solid var(--line);padding:2px 6px;border-radius:4px;letter-spacing:.5px}
.spacer{flex:1}
.status{display:flex;align-items:center;gap:7px;font-size:10px;letter-spacing:1px;color:var(--dim)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px currentColor;animation:blink 1.2s infinite}
.dot.live{background:var(--up);color:var(--up);animation:none}
.dot.dead{background:var(--dn);color:var(--dn)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.clock{font-size:15px;font-weight:600;letter-spacing:1.5px;color:#e6f1ff;text-shadow:0 0 16px rgba(41,182,246,.35)}
.clock small{font-size:9px;color:var(--dim);margin-left:6px;letter-spacing:1px}
.btn{
  background:#152030; color:var(--txt); border:1px solid var(--line);
  border-radius:6px; padding:5px 11px; font-family:var(--mono); font-size:10px;
  letter-spacing:1px; cursor:pointer; transition:.15s;
}
.btn:hover{background:#1c2b3f;border-color:#2c4058;color:#fff}
.btn.rec.on{background:rgba(255,77,94,.16);border-color:var(--dn);color:var(--dn);animation:blink 1.2s infinite}
.ticker{overflow:hidden; border:1px solid var(--line); border-radius:8px; background:#0a1017; display:flex; align-items:center;}
.ticker-track{display:flex;gap:34px;white-space:nowrap;padding-left:14px;animation:scroll 55s linear infinite;will-change:transform}
.ticker:hover .ticker-track{animation-play-state:paused}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tk{display:inline-flex;gap:7px;align-items:center;font-size:11px}
.tk b{color:#93a9c0;font-weight:600;letter-spacing:.6px}
.tk .p{color:#dbe8f5}
.tk .u{color:var(--up)} .tk .d{color:var(--dn)}
.panel{
  background:linear-gradient(180deg,#0e1620,#0a1017);
  border:1px solid var(--line); border-radius:9px;
  display:flex; flex-direction:column; overflow:hidden; min-width:0; min-height:0;
}
.ph{
  height:27px; flex:0 0 27px; display:flex; align-items:center; gap:8px;
  padding:0 10px; border-bottom:1px solid var(--line);
  font-size:9.5px; letter-spacing:1.4px; text-transform:uppercase; color:var(--dim);
  background:linear-gradient(180deg,#121c28,#0c141d);
}
.ph .tag{color:var(--cyan);font-weight:600}
.ph .cnt{margin-left:auto;color:#3d5064;font-size:9px}
.ph .dotc{width:6px;height:6px;border-radius:50%;background:var(--up);box-shadow:0 0 8px var(--up)}
.lists{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;min-height:0}
.rows{flex:1;overflow-y:auto;overflow-x:hidden}
.rows::-webkit-scrollbar{width:5px}
.rows::-webkit-scrollbar-thumb{background:#22303f;border-radius:3px}
.rows::-webkit-scrollbar-track{background:transparent}
.row{
  display:grid; grid-template-columns:16px 40px minmax(0,1fr) 62px 58px;
  align-items:center; gap:5px; padding:3.5px 9px; font-size:10.5px;
  border-bottom:1px solid rgba(255,255,255,.028); transition:background .1s;
}
.row:hover{background:rgba(41,182,246,.055)}
.rk{color:#3a4d61;font-size:9px;text-align:right}
.sym{font-weight:700;color:#dbe9f7;letter-spacing:.4px;font-size:10.5px}
.nm{color:#5d7389;font-size:9.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.px{text-align:right;color:#e6f1ff;font-variant-numeric:tabular-nums;font-size:10.5px}
.ch{text-align:right;font-size:10px;font-variant-numeric:tabular-nums;padding:1px 4px;border-radius:3px}
.ch.u{color:var(--up);background:rgba(0,224,138,.09)}
.ch.d{color:var(--dn);background:rgba(255,77,94,.09)}
.workspace{display:grid;grid-template-columns:minmax(0,2.15fr) minmax(0,1fr) minmax(0,1.05fr);gap:8px;min-height:0}
.tabs{display:flex;gap:3px;padding:5px 8px 0;border-bottom:1px solid var(--line);background:#0c141d}
.tab{
  padding:5px 12px;font-size:9.5px;letter-spacing:1.2px;color:var(--dim);
  border:1px solid transparent;border-bottom:none;border-radius:6px 6px 0 0;cursor:pointer;
  background:transparent;font-family:var(--mono);transition:.15s;
}
.tab:hover{color:#9fb4c8}
.tab.on{color:var(--up);background:#0e1620;border-color:var(--line);box-shadow:inset 0 2px 0 var(--up)}
.chart-body{flex:1;position:relative;min-height:0}
.chart-body canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.legend{
  flex:0 0 24px;display:flex;align-items:center;gap:14px;padding:0 12px;
  border-top:1px solid var(--line);font-size:9px;color:var(--dim);letter-spacing:.6px;background:#0a1017;
}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.ob-head{display:grid;grid-template-columns:1fr 1fr 1fr;padding:3px 10px;font-size:8.5px;color:#3d5064;letter-spacing:.8px;border-bottom:1px solid var(--line)}
.ob-head span:nth-child(2),.ob-head span:nth-child(3){text-align:right}
.ob-side{flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;position:relative}
.ob-side.asks{justify-content:flex-start}
.ob-row{
  display:grid;grid-template-columns:1fr 1fr 1fr;padding:1.4px 10px;font-size:10px;
  position:relative;font-variant-numeric:tabular-nums;
}
.ob-row .bg{position:absolute;top:0;bottom:0;right:0;opacity:.14}
.ob-row span{position:relative;z-index:1}
.ob-row span:nth-child(2),.ob-row span:nth-child(3){text-align:right}
.ob-ask span:first-child{color:var(--dn)} .ob-ask .bg{background:var(--dn)}
.ob-bid span:first-child{color:var(--up)} .ob-bid .bg{background:var(--up)}
.ob-mid{
  flex:0 0 30px;display:flex;align-items:center;justify-content:center;gap:10px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  background:#0c141d;font-size:14px;font-weight:700;letter-spacing:.5px;
}
.ob-mid .spr{font-size:9px;color:var(--dim);font-weight:400}
.depth-wrap{flex:0 0 96px;position:relative;border-top:1px solid var(--line)}
.depth-wrap canvas{position:absolute;inset:0;width:100%;height:100%}
.news-filter{display:flex;gap:3px;margin-left:auto}
.nf{
  font-size:8.5px;padding:2px 7px;border-radius:4px;cursor:pointer;letter-spacing:.8px;
  border:1px solid var(--line);background:transparent;color:var(--dim);font-family:var(--mono);
}
.nf.on{background:#1b2b3d;color:var(--cyan);border-color:#2b4258}
.news-list{flex:1;overflow-y:auto;padding:6px 8px;display:flex;flex-direction:column;gap:6px}
.news-list::-webkit-scrollbar{width:5px}
.news-list::-webkit-scrollbar-thumb{background:#22303f;border-radius:3px}
.ni{border-left:3px solid var(--line); background:rgba(255,255,255,.018); padding:6px 9px; border-radius:0 6px 6px 0;}
.ni.high{border-left-color:var(--dn);background:rgba(255,77,94,.055)}
.ni.med{border-left-color:var(--amber);background:rgba(255,176,32,.045)}
.ni.low{border-left-color:#2c4258}
.ni-top{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.badge{font-size:8px;font-weight:700;letter-spacing:1px;padding:1.5px 5px;border-radius:3px}
.badge.high{background:rgba(255,77,94,.2);color:var(--dn)}
.badge.med{background:rgba(255,176,32,.18);color:var(--amber)}
.badge.low{background:rgba(41,182,246,.14);color:var(--cyan)}
.ni-src{font-size:8.5px;color:#4d6278;letter-spacing:.4px}
.ni-time{margin-left:auto;font-size:8.5px;color:#3d5064}
.ni-head{font-size:10.5px;line-height:1.45;color:#c2d3e4}
.ni-tags{margin-top:4px;display:flex;gap:5px;flex-wrap:wrap}
.ni-tags span{font-size:8.5px;color:var(--cyan);background:rgba(41,182,246,.08);padding:1px 5px;border-radius:3px}
.footer{
  display:flex;align-items:center;gap:18px;padding:0 12px;font-size:9px;color:#3d5064;
  letter-spacing:.9px;border:1px solid var(--line);border-radius:7px;background:#0a1017;
}
.footer b{color:#6d8399;font-weight:500}
.footer .ok{color:var(--up)}

@media (max-width:1000px){
  html,body{overflow:auto;height:auto}
  .app{height:auto;grid-template-rows:none}
  .topbar{flex-wrap:wrap;height:auto;padding:8px 12px;gap:10px}
  .ticker{height:28px}
  .lists{grid-template-columns:1fr 1fr}
  .lists .panel{height:280px}
  .workspace{grid-template-columns:1fr}
  .workspace>.panel{min-height:440px}
  .footer{flex-wrap:wrap;height:auto;padding:6px 12px;gap:10px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="logo">◆</span>APEX<em>DESK</em></div>
    <span class="ver">v1.0 PRO</span>
    <div class="spacer"></div>
    <div class="status"><span class="dot" id="feedDot"></span><span id="feedTxt">CONNECTING…</span></div>
    <div class="clock" id="clock">--:--:--<small>LOCAL</small></div>
    <button class="btn rec" id="recBtn">● REC</button>
    <button class="btn" id="fsBtn">⛶ FULLSCREEN</button>
  </header>
  <div class="ticker"><div class="ticker-track" id="tickerTrack"></div></div>
  <section class="lists">
    <div class="panel"><div class="ph"><span class="dotc"></span>TOP 10 <span class="tag">CRYPTO</span><span class="cnt" id="c-crypto">—</span></div><div class="rows" id="list-crypto"></div></div>
    <div class="panel"><div class="ph"><span class="dotc"></span>TOP 10 <span class="tag">STOCKS</span><span class="cnt" id="c-stocks" style="cursor:pointer" title="Click to add Finnhub API key"></span></div><div class="rows" id="list-stocks"></div></div>
    <div class="panel"><div class="ph"><span class="dotc"></span>TOP 10 <span class="tag">RARE EARTH METALS</span><span class="cnt">$/kg · MANUAL</span></div><div class="rows" id="list-metals"></div></div>
    <div class="panel"><div class="ph"><span class="dotc"></span>TOP 10 <span class="tag">RARE EARTH MINERALS</span><span class="cnt">$/t · MANUAL</span></div><div class="rows" id="list-minerals"></div></div>
  </section>
  <section class="workspace">
    <div class="panel">
      <div class="tabs">
        <button class="tab on" data-tab="footprint">FOOTPRINT</button>
        <button class="tab" data-tab="liquidity">LIQUIDITY HEATMAP</button>
        <button class="tab" data-tab="flow">ORDER FLOW / DELTA</button>
        <button class="tab" data-tab="depth">MARKET DEPTH</button>
      </div>
      <div class="chart-body"><canvas id="mainCanvas"></canvas></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="panel">
      <div class="ph">ORDER BOOK <span class="tag">BTC/USDT</span><span class="cnt" id="obSpread">—</span></div>
      <div class="ob-head"><span>PRICE</span><span>SIZE</span><span>TOTAL</span></div>
      <div class="ob-side asks" id="obAsks"></div>
      <div class="ob-mid"><span id="obMid">—</span><span class="spr" id="obSpr"></span></div>
      <div class="ob-side bids" id="obBids"></div>
      <div class="depth-wrap"><canvas id="depthCanvas"></canvas></div>
    </div>
    <div class="panel">
      <div class="ph">LIVE NEWS
        <div class="news-filter">
          <button class="nf on" data-f="all">ALL</button>
          <button class="nf" data-f="high">HIGH</button>
          <button class="nf" data-f="med">MED</button>
        </div>
      </div>
      <div class="news-list" id="newsList"></div>
    </div>
  </section>
  <footer class="footer">
    <span>FEED <b class="ok" id="fFeed">—</b></span>
    <span>LATENCY <b id="fLat">—</b></span>
    <span>SYMBOLS <b id="fSym">—</b></span>
    <span>NEWS EVENTS <b id="fNews">0</b></span>
    <span>SESSION <b id="fUp">00:00:00</b></span>
    <span style="margin-left:auto">KEYS <b>1 2 3 4</b> · REC <b>R</b> · FULLSCREEN <b>F</b></span>
  </footer>
</div>

<script>
(function(){
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const fmt = (n,d=2) => Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtP = n => n>=1000 ? fmt(n,2) : n>=1 ? fmt(n,3) : n>=0.01 ? fmt(n,4) : fmt(n,6);

const CRYPTO = [
  {bs:'BTCUSDT', sym:'BTC',  name:'Bitcoin',    price:104250,  chg:1.84},
  {bs:'ETHUSDT', sym:'ETH',  name:'Ethereum',   price:3480.5,  chg:-0.72},
  {bs:'SOLUSDT', sym:'SOL',  name:'Solana',     price:196.42,  chg:3.12},
  {bs:'BNBUSDT', sym:'BNB',  name:'BNB',        price:684.20,  chg:0.45},
  {bs:'XRPUSDT', sym:'XRP',  name:'XRP',        price:2.4210,  chg:-1.28},
  {bs:'ADAUSDT', sym:'ADA',  name:'Cardano',    price:0.8920,  chg:2.06},
  {bs:'DOGEUSDT',sym:'DOGE', name:'Dogecoin',   price:0.3180,  chg:-2.44},
  {bs:'AVAXUSDT',sym:'AVAX', name:'Avalanche',  price:38.62,   chg:1.15},
  {bs:'LINKUSDT',sym:'LINK', name:'Chainlink',  price:22.84,   chg:4.31},
  {bs:'DOTUSDT', sym:'DOT',  name:'Polkadot',   price:7.420,   chg:-0.88},
];
const STOCKS = [
  {sym:'NVDA', name:'NVIDIA Corp',    price:182.44},{sym:'AAPL', name:'Apple Inc',      price:241.82},
  {sym:'MSFT', name:'Microsoft Corp', price:512.31},{sym:'TSLA', name:'Tesla Inc',      price:428.65},
  {sym:'AMZN', name:'Amazon.com',     price:231.54},{sym:'GOOGL',name:'Alphabet Inc A', price:198.27},
  {sym:'META', name:'Meta Platforms', price:742.10},{sym:'AVGO', name:'Broadcom Inc',   price:368.92},
  {sym:'TSM',  name:'Taiwan Semi',    price:294.73},{sym:'AMD',  name:'Adv. Micro Dev', price:176.38},
];
const METALS = [
  {sym:'Nd', name:'Neodymium',    price:92.40},{sym:'Pr', name:'Praseodymium', price:104.20},
  {sym:'Dy', name:'Dysprosium',   price:298.50},{sym:'Tb', name:'Terbium',      price:842.00},
  {sym:'La', name:'Lanthanum',    price:2.15},{sym:'Ce', name:'Cerium',       price:2.05},
  {sym:'Sm', name:'Samarium',     price:4.80},{sym:'Eu', name:'Europium',     price:31.60},
  {sym:'Gd', name:'Gadolinium',   price:29.40},{sym:'Y',  name:'Yttrium',      price:26.80},
];
const MINERALS = [
  {sym:'BST', name:'Bastnäsite',   price:14200},{sym:'MNZ', name:'Monazite',     price:9800},
  {sym:'XNT', name:'Xenotime',     price:26400},{sym:'ALN', name:'Allanite',     price:5200},
  {sym:'EUX', name:'Euxenite',     price:7400},{sym:'FRG', name:'Fergusonite',  price:11300},
  {sym:'GDL', name:'Gadolinite',   price:8900},{sym:'SMR', name:'Samarskite',   price:10600},
  {sym:'PRS', name:'Parisite',     price:6700},{sym:'APT', name:'Apatite (REE)',price:3100},
];
[...CRYPTO,...STOCKS,...METALS,...MINERALS].forEach(o=>{o.price=null;o.chg=null;});

let LIVE = false;
let LATENCY = 0;
const T0 = Date.now();
const depth = { bids:[], asks:[], mid:0 };
let newsFilter = 'all';

function setFeed(state, txt){
  $('#feedDot').className = 'dot ' + (state==='live'?'live':state==='dead'?'dead':'');
  $('#feedTxt').textContent = txt;
  $('#fFeed').textContent = txt;
  $('#fFeed').className = state==='live' ? 'ok' : '';
}

function initFeed(){
  setFeed('wait','CONNECTING…');
  let ws;
  try{
    const streams = [...CRYPTO.map(c=>c.bs.toLowerCase()+'@ticker'),'btcusdt@depth20@100ms','btcusdt@aggTrade'].join('/');
    ws = new WebSocket('wss://stream.binance.com:9443/stream?streams='+streams);
  }catch(e){ return fallback(); }
  ws.onopen = () => { LIVE = true; setFeed('live','LIVE · BINANCE WS'); };
  ws.onmessage = ev => {
    let m; try{ m = JSON.parse(ev.data); }catch(_){ return; }
    const s = m.stream, d = m.data;
    if(!s || !d) return;
    if(s.endsWith('@ticker')) onTicker(d);
    else if(s.includes('@depth')) onDepth(d);
    else if(s.includes('@aggTrade')) onTrade(d);
  };
  ws.onerror = () => { LIVE = false; setFeed('dead','FEED ERROR · SIM MODE'); };
  ws.onclose = () => { LIVE = false; setFeed('dead','RECONNECTING…'); setTimeout(initFeed, 6000); };
}
function fallback(){ LIVE=false; setFeed('dead','SIM MODE (OFFLINE)'); }

function onTicker(d){
  const c = CRYPTO.find(x=>x.bs===d.s); if(!c) return;
  c._prev = c.price; c.price = +d.c; c.chg = +d.P;
}
function onDepth(d){
  depth.bids = d.bids.map(([p,q])=>[+p,+q]);
  depth.asks = d.asks.map(([p,q])=>[+p,+q]);
  if(depth.bids[0] && depth.asks[0]) depth.mid = (depth.bids[0][0]+depth.asks[0][0])/2;
}


function rowHTML(o, i){
  const has = o.price!=null, up=(o.chg||0)>=0;
  const right = o.manual ? `<span class="ch" style="color:#5f7288">${o.asof||'set'}</span>`
    : `<span class="ch ${o.chg==null?'':up?'u':'d'}">${o.chg==null?'—':(up?'+':'')+o.chg.toFixed(2)+'%'}</span>`;
  return `<div class="row" data-sym="${o.sym}"${o.manual?' style="cursor:pointer" title="Click to enter the current price"':''}><span class="rk">${i+1}</span><span class="sym">${o.sym}</span><span class="nm">${o.name}</span><span class="px">${has?fmtP(o.price):'—'}</span>${right}</div>`;
}
function renderList(el, arr){ el.innerHTML = arr.map((o,i)=>rowHTML(o,i)).join(''); }

/* ---------------- REAL DATA: stocks (Finnhub) + manual rare-earth prices ---------------- */
let FKEY='';try{FKEY=localStorage.getItem('fk')||''}catch(e){}
async function fetchStocks(){
  if(!FKEY)return;
  await Promise.all(STOCKS.map(async o=>{
    try{const j=await (await fetch('https://finnhub.io/api/v1/quote?symbol='+o.sym+'&token='+FKEY)).json();
      if(j&&j.c){o.price=j.c;o.chg=j.dp;}}catch(e){}
  }));
}
$('#c-stocks').onclick=()=>{
  const k=prompt('Paste your free Finnhub API key (finnhub.io → Register → API key):',FKEY);
  if(k===null)return;FKEY=k.trim();try{localStorage.setItem('fk',FKEY)}catch(e){}fetchStocks();
};
setInterval(()=>{$('#c-stocks').textContent=FKEY?'US · LIVE':'ADD API KEY ▸';},1000);
setInterval(fetchStocks,15000);fetchStocks();

let MAN={};try{MAN=JSON.parse(localStorage.getItem('man')||'{}')}catch(e){}
[...METALS,...MINERALS].forEach(o=>{o.manual=1;const m=MAN[o.sym];if(m){o.price=m.p;o.asof=m.d;}});
function editManual(sym){
  const o=[...METALS,...MINERALS].find(x=>x.sym===sym);if(!o)return;
  const v=prompt('Current price for '+o.name+' (copy from SMM / Asian Metal / your supplier):',o.price==null?'':o.price);
  if(v===null)return;const n=parseFloat(v);if(!(n>0))return;
  o.price=n;o.asof=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
  MAN[sym]={p:n,d:o.asof};try{localStorage.setItem('man',JSON.stringify(MAN))}catch(e){}
}
['#list-metals','#list-minerals'].forEach(q=>$(q).onclick=e=>{const r=e.target.closest('.row');if(r)editManual(r.dataset.sym)});

function renderAllLists(){
  renderList($('#list-crypto'), CRYPTO);
  renderList($('#list-stocks'), STOCKS);
  renderList($('#list-metals'), METALS);
  renderList($('#list-minerals'), MINERALS);
}

/* ---------------- TICKER ---------------- */
function renderTicker(){
  const all=[...CRYPTO,...STOCKS.slice(0,5)].filter(o=>o.price!=null);
  const h=all.map(o=>`<span class="tk"><b>${o.sym}</b><span class="p">${fmtP(o.price)}</span><span class="${o.chg>=0?'u':'d'}">${o.chg>=0?'▲':'▼'} ${Math.abs(o.chg).toFixed(2)}%</span></span>`).join('');
  $('#tickerTrack').innerHTML=h+h;
}
